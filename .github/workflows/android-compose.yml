name: JARVIS Android Compose Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          JARVIS_API_BASE_URL: ${{ secrets.JARVIS_API_BASE_URL }}
          JARVIS_SETUP_TOKEN: ${{ secrets.JARVIS_SETUP_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/JARVIS-Watch-Bridge-latest.apk
          cd ../dist
          sha256sum JARVIS-Watch-Bridge-latest.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-Android
          path: |
            dist/JARVIS-Watch-Bridge-latest.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
