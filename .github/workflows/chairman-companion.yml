name: JARVIS Chairman Companion Android

on:
  push:
    branches:
      - feature/chairman-companion-bridge
    paths:
      - 'android/**'
      - '.github/workflows/chairman-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-chairman-companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Chairman Companion APK
        run: gradle :app:assembleChairmanCompanion --stacktrace

      - name: Stage APK and checksum
        run: |
          set -euo pipefail
          mkdir -p ../dist
          APK="app/build/outputs/apk/chairmanCompanion/app-chairmanCompanion.apk"
          test -f "$APK"
          cp "$APK" ../dist/JARVIS-Chairman-Companion-Android.apk
          cd ../dist
          sha256sum JARVIS-Chairman-Companion-Android.apk > SHA256SUMS.txt

      - name: Upload Chairman Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Chairman-Companion-Android
          path: |
            dist/JARVIS-Chairman-Companion-Android.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
