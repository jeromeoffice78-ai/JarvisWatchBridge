name: JARVIS Watch Bridge Production Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-shell/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read
  id-token: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app
  JARVIS_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-shell/package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: native-shell
        run: npm install --no-audit --no-fund

      - name: Prepare Capacitor Android project
        working-directory: native-shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

          python - <<'PY'
          from pathlib import Path

          # Android 14+ microphone foreground-service requirements.
          plugin_root = Path('node_modules/@capawesome-team/capacitor-android-foreground-service')
          for manifest in plugin_root.rglob('AndroidManifest.xml'):
              text = manifest.read_text()
              if 'AndroidForegroundService' not in text:
                  continue
              root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if 'android.permission.FOREGROUND_SERVICE_MICROPHONE' not in text and root in text:
                  text = text.replace(
                      root,
                      root + '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
                      1,
                  )
              if 'android:foregroundServiceType="microphone"' not in text:
                  text = text.replace(
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService"',
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="microphone"',
                      1,
                  )
              manifest.write_text(text)

          app_manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = app_manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          required = [
              ('android.permission.RECORD_AUDIO', '<uses-permission android:name="android.permission.RECORD_AUDIO" />'),
              ('android.permission.POST_NOTIFICATIONS', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'),
              ('android.permission.FOREGROUND_SERVICE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'),
              ('android.permission.FOREGROUND_SERVICE_MICROPHONE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />'),
              ('android.permission.WAKE_LOCK', '<uses-permission android:name="android.permission.WAKE_LOCK" />'),
              ('android.permission.BLUETOOTH_SCAN', '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'),
              ('android.permission.BLUETOOTH_CONNECT', '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'),
              ('android.permission.ACCESS_COARSE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />'),
              ('android.permission.ACCESS_FINE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'),
          ]
          for permission_name, entry in required:
              if permission_name not in text:
                  text = text.replace(root, root + '\n    ' + entry, 1)
          if 'android.hardware.bluetooth_le' not in text:
              text = text.replace(
                  root,
                  root + '\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />',
                  1,
              )
          app_manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 1', 'versionCode 20')
          g = g.replace('versionName "1.0"', 'versionName "2.0.0"')
          gradle.write_text(g)
          PY

          npx cap sync android
          chmod +x android/gradlew

          echo '--- App manifest native requirements ---'
          grep -E 'RECORD_AUDIO|POST_NOTIFICATIONS|FOREGROUND_SERVICE|WAKE_LOCK|BLUETOOTH|ACCESS_.*LOCATION|hardware.bluetooth_le' android/app/src/main/AndroidManifest.xml || true

      - name: Retrieve permanent JARVIS signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_signing
          OIDC_JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python - <<'PY'
          import json, os
          token = json.loads(os.environ['OIDC_JSON']).get('value', '')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "${JARVIS_HTTP_BASE}/_api/v1/internal/android-signing" \
            -o /tmp/jarvis_signing/identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/jarvis_signing/identity.json').read_text())
          private_key = payload.get('privateKeyPem', '')
          certificate = payload.get('certificatePem', '')
          fingerprint = payload.get('certificateSha256', '').lower()
          expected = '004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f'
          if not private_key.startswith('-----BEGIN') or 'PRIVATE KEY-----' not in private_key:
              raise SystemExit('Signing service returned an invalid private key.')
          if not certificate.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('Signing service returned an invalid certificate.')
          if fingerprint != expected:
              raise SystemExit('Signing certificate fingerprint mismatch.')
          Path('/tmp/jarvis_signing/private-key.pem').write_text(private_key)
          Path('/tmp/jarvis_signing/certificate.pem').write_text(certificate)
          PY
          chmod 600 /tmp/jarvis_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in /tmp/jarvis_signing/private-key.pem \
            -out /tmp/jarvis_signing/private-key.pk8
          ACTUAL_CERT_SHA="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA" = "$JARVIS_SIGNING_CERT_SHA256"

      - name: Build unsigned release APK
        working-directory: native-shell/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          UNSIGNED="$(find native-shell/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -f "$UNSIGNED"
          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/JARVIS-Watch-Bridge-aligned.apk
          "$APKSIGNER" sign \
            --key /tmp/jarvis_signing/private-key.pk8 \
            --cert /tmp/jarvis_signing/certificate.pem \
            --out dist/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk \
            /tmp/JARVIS-Watch-Bridge-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk
          "$AAPT" dump badging dist/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk > /tmp/jarvis-badging.txt
          "$AAPT" dump permissions dist/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk > /tmp/jarvis-permissions.txt
          echo '--- APK badging ---'
          head -n 12 /tmp/jarvis-badging.txt
          echo '--- APK permissions ---'
          cat /tmp/jarvis-permissions.txt

          grep -Fq "package: name='com.jarvis.watchbridge'" /tmp/jarvis-badging.txt
          for permission in \
            android.permission.RECORD_AUDIO \
            android.permission.BLUETOOTH_SCAN \
            android.permission.BLUETOOTH_CONNECT \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_MICROPHONE \
            android.permission.POST_NOTIFICATIONS; do
              grep -Fq "$permission" /tmp/jarvis-permissions.txt || { echo "Missing required permission: $permission" >&2; exit 1; }
          done

          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s  JARVIS permanent Android signing certificate\n' "$JARVIS_SIGNING_CERT_SHA256" > dist/SIGNING-CERT-SHA256.txt
          rm -rf /tmp/jarvis_signing /tmp/JARVIS-Watch-Bridge-aligned.apk /tmp/jarvis-badging.txt /tmp/jarvis-permissions.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-v2.0.0-PRODUCTION-Android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT-SHA256.txt
          retention-days: 30
