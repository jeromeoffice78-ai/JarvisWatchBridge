name: Integrate JARVIS Cloud Knowledge

on:
  workflow_dispatch:
  push:
    branches: [production-hardening-v2.3.0]
    paths:
      - 'backend/knowledge.py'
      - 'scripts/integrate_knowledge_backend.py'
      - '.github/workflows/integrate-knowledge-backend.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production-hardening-v2.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire knowledge retrieval into chat
        run: python scripts/integrate_knowledge_backend.py
      - name: Verify backend integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'app.include_router(knowledge_router)' backend/main.py
          grep -Fq 'retrieve_context(req.message, client)' backend/main.py
          grep -Fq 'untrusted reference material' backend/main.py
          python -m py_compile backend/main.py backend/knowledge.py backend/team.py
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Knowledge integration already current.'
            exit 0
          fi
          git config user.name 'jarvis-production-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'Wire cloud knowledge into live JARVIS chat [skip ci]'
          git push origin HEAD:production-hardening-v2.3.0
