name: Publish JARVIS Watch Bridge APK Release

on:
  workflow_run:
    workflows: ["JARVIS Watch Bridge Production Android"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name JARVIS-Watch-Bridge-v2.0.0-PRODUCTION-Android \
            --dir artifact
          test -f artifact/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk
          test -f artifact/SHA256SUMS.txt
          sha256sum -c artifact/SHA256SUMS.txt

      - name: Publish stable GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG="watch-bridge-v2.0.0-run-${RUN_ID}"
          gh release create "$TAG" \
            artifact/JARVIS-Watch-Bridge-v2.0.0-PERMANENT-SIGNED.apk \
            artifact/SHA256SUMS.txt \
            artifact/SIGNING-CERT-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "JARVIS Watch Bridge Android v2.0.0" \
            --notes "Verified production Android APK built by GitHub Actions for the live JARVIS Watch Bridge backend."
