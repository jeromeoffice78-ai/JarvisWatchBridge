name: JARVIS Watch Bridge Universal Compatibility Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-shell/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write
  id-token: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app
  JARVIS_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f

jobs:
  build-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: native-shell
        run: npm install --no-audit --no-fund

      - name: Prepare universal compatibility Android project
        working-directory: native-shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          cp capacitor.config.json /tmp/capacitor.config.original.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          data = json.loads(p.read_text())
          data['appId'] = 'com.jarvis.watchbridge.compat'
          data['appName'] = 'JARVIS Watch Bridge'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npx cap add android

          python - <<'PY'
          from pathlib import Path

          plugin_root = Path('node_modules/@capawesome-team/capacitor-android-foreground-service')
          for manifest in plugin_root.rglob('AndroidManifest.xml'):
              text = manifest.read_text()
              if 'AndroidForegroundService' not in text:
                  continue
              root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if 'android.permission.FOREGROUND_SERVICE_MICROPHONE' not in text and root in text:
                  text = text.replace(root, root + '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />', 1)
              if 'android:foregroundServiceType="microphone"' not in text:
                  text = text.replace(
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService"',
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="microphone"', 1)
              manifest.write_text(text)

          app_manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = app_manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          required = [
              ('android.permission.RECORD_AUDIO', '<uses-permission android:name="android.permission.RECORD_AUDIO" />'),
              ('android.permission.POST_NOTIFICATIONS', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'),
              ('android.permission.FOREGROUND_SERVICE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'),
              ('android.permission.FOREGROUND_SERVICE_MICROPHONE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />'),
              ('android.permission.WAKE_LOCK', '<uses-permission android:name="android.permission.WAKE_LOCK" />'),
              ('android.permission.BLUETOOTH_SCAN', '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'),
              ('android.permission.BLUETOOTH_CONNECT', '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'),
              ('android.permission.ACCESS_COARSE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />'),
              ('android.permission.ACCESS_FINE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'),
          ]
          for permission_name, entry in required:
              if permission_name not in text:
                  text = text.replace(root, root + '\n    ' + entry, 1)
          if 'android.hardware.bluetooth_le' not in text:
              text = text.replace(root, root + '\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />', 1)
          app_manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 1', 'versionCode 21')
          g = g.replace('versionName "1.0"', 'versionName "2.0.1"')
          gradle.write_text(g)
          PY

          npx cap sync android
          chmod +x android/gradlew
          mv /tmp/capacitor.config.original.json capacitor.config.json

      - name: Retrieve permanent JARVIS signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_signing
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python - <<'PY'
          import json, os
          token = json.loads(os.environ['OIDC_JSON']).get('value', '')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" "${JARVIS_HTTP_BASE}/_api/v1/internal/android-signing" -o /tmp/jarvis_signing/identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/jarvis_signing/identity.json').read_text())
          fingerprint = payload.get('certificateSha256', '').lower()
          if fingerprint != '004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f':
              raise SystemExit('Signing certificate fingerprint mismatch.')
          Path('/tmp/jarvis_signing/private-key.pem').write_text(payload['privateKeyPem'])
          Path('/tmp/jarvis_signing/certificate.pem').write_text(payload['certificatePem'])
          PY
          chmod 600 /tmp/jarvis_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt -in /tmp/jarvis_signing/private-key.pem -out /tmp/jarvis_signing/private-key.pk8

      - name: Build, sign, and verify universal APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-shell/android
          ./gradlew assembleRelease --stacktrace
          cd ../..
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          UNSIGNED="$(find native-shell/android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" /tmp/jarvis-universal-aligned.apk
          "$APKSIGNER" sign --key /tmp/jarvis_signing/private-key.pk8 --cert /tmp/jarvis_signing/certificate.pem --out dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1.apk /tmp/jarvis-universal-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1.apk
          "$AAPT" dump badging dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1.apk > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -Fq "package: name='com.jarvis.watchbridge.compat'" /tmp/badging.txt
          if grep -q '^native-code:' /tmp/badging.txt; then
            grep -Eq "'arm64-v8a'|'armeabi-v7a'|'x86_64'" /tmp/badging.txt || { echo 'APK lacks common Android ABIs' >&2; exit 1; }
          fi
          sha256sum dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1.apk > dist/SHA256SUMS.txt

      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="watch-bridge-universal-v2.0.1-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Watch Bridge Universal Android v2.0.1" \
            --notes "Universal compatibility build for modern Android devices. Uses a separate package ID to avoid conflicts with earlier JARVIS installs."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-UNIVERSAL-v2.0.1
          path: dist/*
          retention-days: 30
