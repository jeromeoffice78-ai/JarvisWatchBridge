name: JARVIS Watch Bridge Universal Compatibility Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-shell/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app

jobs:
  build-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: native-shell
        run: npm install --no-audit --no-fund

      - name: Prepare universal compatibility Android project
        working-directory: native-shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          cp capacitor.config.json /tmp/capacitor.config.original.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          data = json.loads(p.read_text())
          data['appId'] = 'com.jarvis.watchbridge.compat'
          data['appName'] = 'JARVIS Watch Bridge'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npx cap add android

          python - <<'PY'
          from pathlib import Path

          plugin_root = Path('node_modules/@capawesome-team/capacitor-android-foreground-service')
          for manifest in plugin_root.rglob('AndroidManifest.xml'):
              text = manifest.read_text()
              if 'AndroidForegroundService' not in text:
                  continue
              root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if 'android.permission.FOREGROUND_SERVICE_MICROPHONE' not in text and root in text:
                  text = text.replace(root, root + '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />', 1)
              if 'android:foregroundServiceType="microphone"' not in text:
                  text = text.replace(
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService"',
                      '<service android:name="io.capawesome.capacitorjs.plugins.foregroundservice.AndroidForegroundService" android:foregroundServiceType="microphone"', 1)
              manifest.write_text(text)

          app_manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = app_manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          required = [
              ('android.permission.RECORD_AUDIO', '<uses-permission android:name="android.permission.RECORD_AUDIO" />'),
              ('android.permission.POST_NOTIFICATIONS', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'),
              ('android.permission.FOREGROUND_SERVICE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />'),
              ('android.permission.FOREGROUND_SERVICE_MICROPHONE', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />'),
              ('android.permission.WAKE_LOCK', '<uses-permission android:name="android.permission.WAKE_LOCK" />'),
              ('android.permission.BLUETOOTH_SCAN', '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'),
              ('android.permission.BLUETOOTH_CONNECT', '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'),
              ('android.permission.ACCESS_COARSE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />'),
              ('android.permission.ACCESS_FINE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'),
          ]
          for permission_name, entry in required:
              if permission_name not in text:
                  text = text.replace(root, root + '\n    ' + entry, 1)
          if 'android.hardware.bluetooth_le' not in text:
              text = text.replace(root, root + '\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />', 1)
          app_manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 1', 'versionCode 22')
          g = g.replace('versionName "1.0"', 'versionName "2.0.2"')
          gradle.write_text(g)
          PY

          npx cap sync android
          chmod +x android/gradlew
          mv /tmp/capacitor.config.original.json capacitor.config.json

      - name: Build GitHub-signed universal APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-shell/android
          ./gradlew assembleDebug --stacktrace
          cd ../..
          APK="$(find native-shell/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk
          "$AAPT" dump badging dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk > /tmp/badging.txt
          "$AAPT" dump permissions dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk > /tmp/permissions.txt
          cat /tmp/badging.txt
          cat /tmp/permissions.txt
          grep -Fq "package: name='com.jarvis.watchbridge.compat'" /tmp/badging.txt
          for permission in android.permission.RECORD_AUDIO android.permission.BLUETOOTH_SCAN android.permission.BLUETOOTH_CONNECT; do
            grep -Fq "$permission" /tmp/permissions.txt || { echo "Missing required permission: $permission" >&2; exit 1; }
          done
          sha256sum dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk > dist/SHA256SUMS.txt

      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="watch-bridge-universal-v2.0.2-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Watch Bridge Universal Android v2.0.2" \
            --notes "GitHub-native compatibility build. This build no longer depends on the Floot signing endpoint and uses a separate Android package ID to avoid conflicts with earlier installs."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-UNIVERSAL-v2.0.2
          path: dist/*
          retention-days: 30
