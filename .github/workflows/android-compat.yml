name: JARVIS Watch Bridge v2.5 Production

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'backend/**'
      - '.github/workflows/android-compat.yml'
  push:
    branches: [main, production-hardening-v2.3.0]
    paths:
      - 'android/**'
      - 'backend/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare persistent release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${STORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/jarvis-watch-bridge-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "JARVIS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured; CI will produce an unsigned release candidate only."
          fi

      - name: Verify source capability contract
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/jarvis/watchbridge/mood/MoodEngine.kt
          test -f android/app/src/main/java/com/jarvis/watchbridge/device/DeviceRoleManager.kt
          test -f android/app/src/main/java/com/jarvis/watchbridge/control/JarvisAccessibilityService.kt
          test -f android/app/src/main/java/com/jarvis/watchbridge/control/JarvisRemoteCommandService.kt
          test -f android/app/src/main/java/com/jarvis/watchbridge/security/DeviceSecurityScanner.kt
          grep -Fq 'RecognizerIntent.ACTION_RECOGNIZE_SPEECH' android/app/src/main/java/com/jarvis/watchbridge/MainActivity.kt
          grep -Fq 'connectTargetWatch' android/app/src/main/java/com/jarvis/watchbridge/ble/BleManager.kt
          grep -Fq 'Take Over Watch Connection' android/app/src/main/java/com/jarvis/watchbridge/MainActivity.kt
          grep -Fq 'Accessibility control disclosure' android/app/src/main/java/com/jarvis/watchbridge/MainActivity.kt
          grep -Fq 'x-jarvis-admin-token' android/app/src/main/java/com/jarvis/watchbridge/ai/ChatRepository.kt
          grep -Fq 'status") != "approved"' android/app/src/main/java/com/jarvis/watchbridge/control/JarvisRemoteCommandService.kt

      - name: Compile, test and lint Android release
        working-directory: android
        env:
          JARVIS_API_BASE_URL: https://jarvis-watch-bridge-api.onrender.com/
          JARVIS_SETUP_TOKEN: ${{ secrets.JARVIS_SETUP_TOKEN }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify production APK contract
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          test -f "$APK"
          test -f "$AAB"

          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          APKANALYZER="$(find "${ANDROID_HOME}" -type f -name apkanalyzer | head -1 || true)"

          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/permissions.txt
          cat /tmp/badging.txt
          cat /tmp/permissions.txt

          grep -Fq "package: name='com.jarvis.chairman'" /tmp/badging.txt
          grep -Fq "versionCode='250'" /tmp/badging.txt
          grep -Fq "versionName='2.5.0'" /tmp/badging.txt
          grep -Fq "targetSdkVersion:'36'" /tmp/badging.txt

          for permission in \
            android.permission.INTERNET \
            android.permission.RECORD_AUDIO \
            android.permission.CAMERA \
            android.permission.BLUETOOTH_SCAN \
            android.permission.BLUETOOTH_CONNECT \
            android.permission.POST_NOTIFICATIONS \
            android.permission.FOREGROUND_SERVICE_MICROPHONE \
            android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE; do
            grep -Fq "$permission" /tmp/permissions.txt || {
              echo "Missing required permission: $permission" >&2
              exit 1
            }
          done

          if [[ -n "$APKANALYZER" ]]; then
            DEBUGGABLE="$($APKANALYZER manifest debuggable "$APK" | tr -d '\r\n')"
            [[ "$DEBUGGABLE" == "false" ]] || {
              echo "Release APK is debuggable: $DEBUGGABLE" >&2
              exit 1
            }
          fi

          mkdir -p ../dist
          cp "$APK" ../dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.apk
          cp "$AAB" ../dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.aab

          if [[ "${{ steps.signing.outputs.ready }}" == "true" ]]; then
            "$APKSIGNER" verify --verbose --print-certs ../dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.apk
            echo "SIGNED_PRODUCTION_RELEASE" > ../dist/SIGNING-STATUS.txt
          else
            echo "UNSIGNED_RELEASE_CANDIDATE" > ../dist/SIGNING-STATUS.txt
          fi

          sha256sum ../dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.apk \
                    ../dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.aab \
                    > ../dist/SHA256SUMS.txt

      - name: Test backend device-control contract
        shell: bash
        env:
          JARVIS_SETUP_TOKEN: ci-test-token
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt >/dev/null
          python -m py_compile backend/main.py
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8765 >/tmp/jarvis-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/health >/tmp/health.json && break
            sleep 1
          done
          grep -Fq '"status":"ok"' /tmp/health.json

          AUTH='x-jarvis-admin-token: ci-test-token'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"deviceId":"android-ci","deviceName":"CI Android","deviceModel":"CI","preferredRole":"primary","connected":true,"watchBleAddress":"41:42:69:41:49:D5"}' \
            http://127.0.0.1:8765/device/register > /tmp/register.json
          grep -Fq '"role":"primary"' /tmp/register.json

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"deviceId":"android-ci","action":"volume_set","payload":{"percent":75}}' \
            http://127.0.0.1:8765/device/command > /tmp/command.json
          COMMAND_ID="$(python -c 'import json; print(json.load(open("/tmp/command.json"))["id"])')"

          curl -fsS -H "$AUTH" 'http://127.0.0.1:8765/device/commands?deviceId=android-ci' > /tmp/commands.json
          grep -Fq "$COMMAND_ID" /tmp/commands.json

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"commandId\":\"$COMMAND_ID\",\"deviceId\":\"android-ci\",\"status\":\"succeeded\",\"result\":{\"message\":\"CI verified\"}}" \
            http://127.0.0.1:8765/device/result > /tmp/result.json
          grep -Fq '"status":"succeeded"' /tmp/result.json

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-v2.5.0-production-candidate
          path: dist/*
          retention-days: 30

      - name: Publish signed production release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jarvis-watch-bridge-v2.5.0-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.apk \
            dist/JARVIS-Watch-Bridge-v2.5.0-FULL-RELEASE.aab \
            dist/SHA256SUMS.txt \
            dist/SIGNING-STATUS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Watch Bridge v2.5.0 Production" \
            --notes "Full Chairman production build: AI chat, BLE watch host/reconnect, Health Connect, voice/wake service, TTS/audio routing, phone alerts, multi-device takeover, mood adaptation, visible approved remote device controls, and device security inventory."
