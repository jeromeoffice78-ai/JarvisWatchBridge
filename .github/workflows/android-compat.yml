name: JARVIS Chairman Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

jobs:
  build-chairman:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build Chairman JARVIS APK
        working-directory: android
        env:
          JARVIS_API_BASE_URL: https://jarvis-watch-bridge-api.onrender.com/
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/JARVIS-CHAIRMAN-v2.2.0.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs ../dist/JARVIS-CHAIRMAN-v2.2.0.apk
          "$AAPT" dump badging ../dist/JARVIS-CHAIRMAN-v2.2.0.apk > /tmp/badging.txt
          "$AAPT" dump permissions ../dist/JARVIS-CHAIRMAN-v2.2.0.apk > /tmp/permissions.txt
          cat /tmp/badging.txt
          cat /tmp/permissions.txt
          grep -Fq "package: name='com.jarvis.chairman'" /tmp/badging.txt
          grep -Fq "versionCode='220'" /tmp/badging.txt
          grep -Fq "versionName='2.2.0'" /tmp/badging.txt
          for permission in android.permission.INTERNET android.permission.RECORD_AUDIO android.permission.BLUETOOTH_SCAN android.permission.BLUETOOTH_CONNECT android.permission.FOREGROUND_SERVICE_MICROPHONE; do
            grep -Fq "$permission" /tmp/permissions.txt || { echo "Missing required permission: $permission" >&2; exit 1; }
          done
          sha256sum ../dist/JARVIS-CHAIRMAN-v2.2.0.apk > ../dist/SHA256SUMS.txt

      - name: Publish Chairman release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jarvis-chairman-v2.2.0-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-CHAIRMAN-v2.2.0.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Chairman Android v2.2.0" \
            --notes "Chairman package build using com.jarvis.chairman to avoid conflicts with earlier JARVIS test packages. Includes the Chairman command-center UI, embedded human JARVIS portrait, chat, BLE watch connection, health integration where available, notifications, audio routing, speech output, wake-word service, and JARVIS visual states."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CHAIRMAN-v2.2.0
          path: dist/*
          retention-days: 30
