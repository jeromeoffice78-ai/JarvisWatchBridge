name: JARVIS Full Native Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

jobs:
  build-full-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare full JARVIS Android app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          text = text.replace('applicationId = "com.jarvis.watchbridge"', 'applicationId = "com.jarvis.watchbridge.full"')
          text = text.replace('versionCode = 3', 'versionCode = 25')
          text = text.replace('versionName = "0.3.0"', 'versionName = "2.1.0"')
          p.write_text(text)
          PY

      - name: Build full native JARVIS APK
        working-directory: android
        env:
          JARVIS_API_BASE_URL: https://jarvis-watch-bridge-api.onrender.com/
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/JARVIS-FULL-NATIVE-v2.1.0.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs ../dist/JARVIS-FULL-NATIVE-v2.1.0.apk
          "$AAPT" dump badging ../dist/JARVIS-FULL-NATIVE-v2.1.0.apk > /tmp/badging.txt
          "$AAPT" dump permissions ../dist/JARVIS-FULL-NATIVE-v2.1.0.apk > /tmp/permissions.txt
          cat /tmp/badging.txt
          cat /tmp/permissions.txt
          grep -Fq "package: name='com.jarvis.watchbridge.full'" /tmp/badging.txt
          for permission in android.permission.INTERNET android.permission.RECORD_AUDIO android.permission.BLUETOOTH_SCAN android.permission.BLUETOOTH_CONNECT android.permission.FOREGROUND_SERVICE_MICROPHONE; do
            grep -Fq "$permission" /tmp/permissions.txt || { echo "Missing required permission: $permission" >&2; exit 1; }
          done
          sha256sum ../dist/JARVIS-FULL-NATIVE-v2.1.0.apk > ../dist/SHA256SUMS.txt

      - name: Publish full native release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jarvis-full-native-v2.1.0-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-FULL-NATIVE-v2.1.0.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Full Native Android v2.1.0" \
            --notes "Full native JARVIS Android build from the designed Kotlin/Compose application. Includes JARVIS chat, BLE watch scanning/connection, health access, notifications, phone-message sync, audio routing, speech output, wake-word foreground service, and the animated JARVIS face. Uses a separate package ID so it can be installed beside earlier test builds."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FULL-NATIVE-v2.1.0
          path: dist/*
          retention-days: 30
