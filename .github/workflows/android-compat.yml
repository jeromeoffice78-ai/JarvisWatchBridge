name: JARVIS Watch Bridge Crash-Safe Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-shell/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app

jobs:
  build-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare crash-safe native dependencies
        working-directory: native-shell
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.original.json
          cp capacitor.config.json /tmp/capacitor.config.original.json
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          keep = {
              '@capacitor/android',
              '@capacitor/core',
              '@aparajita/capacitor-secure-storage',
          }
          data['dependencies'] = {
              k: v for k, v in data.get('dependencies', {}).items() if k in keep
          }
          package.write_text(json.dumps(data, indent=2) + '\n')

          config = Path('capacitor.config.json')
          cfg = json.loads(config.read_text())
          cfg['appId'] = 'com.jarvis.watchbridge.safe'
          cfg['appName'] = 'JARVIS Watch Bridge Safe'
          cfg['server'] = {
              'url': 'https://jarvis-watch-bridge.floot.app',
              'cleartext': False,
          }
          config.write_text(json.dumps(cfg, indent=2) + '\n')
          PY
          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          python - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text = text.replace('versionCode 1', 'versionCode 23')
          text = text.replace('versionName "1.0"', 'versionName "2.0.3"')
          gradle.write_text(text)
          PY

          chmod +x android/gradlew
          mv /tmp/package.original.json package.json
          mv /tmp/capacitor.config.original.json capacitor.config.json

      - name: Build crash-safe APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-shell/android
          ./gradlew assembleDebug --stacktrace
          cd ../..
          APK="$(find native-shell/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/JARVIS-Watch-Bridge-SAFE-v2.0.3.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Watch-Bridge-SAFE-v2.0.3.apk
          "$AAPT" dump badging dist/JARVIS-Watch-Bridge-SAFE-v2.0.3.apk > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -Fq "package: name='com.jarvis.watchbridge.safe'" /tmp/badging.txt
          sha256sum dist/JARVIS-Watch-Bridge-SAFE-v2.0.3.apk > dist/SHA256SUMS.txt

      - name: Publish crash-safe release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="watch-bridge-safe-v2.0.3-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-Watch-Bridge-SAFE-v2.0.3.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Watch Bridge Safe Android v2.0.3" \
            --notes "Crash-safe recovery build. Uses a separate package ID and removes foreground-service, speech, BLE, notification, and share native plugins from startup while retaining Capacitor core and secure storage. This isolates the immediate-launch crash before native features are reintroduced one by one."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-SAFE-v2.0.3
          path: dist/*
          retention-days: 30
