name: JARVIS Watch Bridge Full Recovery Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native-shell/**'
      - '.github/workflows/android-compat.yml'

permissions:
  contents: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app

jobs:
  build-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare full-function recovery project
        working-directory: native-shell
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.original.json
          cp capacitor.config.json /tmp/capacitor.config.original.json
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          # Keep JARVIS native capabilities but temporarily isolate the Android
          # foreground-service plugin, the highest-risk immediate-launch component.
          data['dependencies'].pop('@capawesome-team/capacitor-android-foreground-service', None)
          package.write_text(json.dumps(data, indent=2) + '\n')

          config = Path('capacitor.config.json')
          cfg = json.loads(config.read_text())
          cfg['appId'] = 'com.jarvis.watchbridge.recovery'
          cfg['appName'] = 'JARVIS Watch Bridge'
          cfg['server'] = {
              'url': 'https://jarvis-watch-bridge.floot.app',
              'cleartext': False,
          }
          config.write_text(json.dumps(cfg, indent=2) + '\n')
          PY

          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          python - <<'PY'
          from pathlib import Path

          app_manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = app_manifest.read_text()
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          required = [
              ('android.permission.RECORD_AUDIO', '<uses-permission android:name="android.permission.RECORD_AUDIO" />'),
              ('android.permission.POST_NOTIFICATIONS', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'),
              ('android.permission.WAKE_LOCK', '<uses-permission android:name="android.permission.WAKE_LOCK" />'),
              ('android.permission.BLUETOOTH_SCAN', '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'),
              ('android.permission.BLUETOOTH_CONNECT', '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'),
              ('android.permission.ACCESS_COARSE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="30" />'),
              ('android.permission.ACCESS_FINE_LOCATION', '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'),
          ]
          for permission_name, entry in required:
              if permission_name not in text:
                  text = text.replace(root, root + '\n    ' + entry, 1)
          if 'android.hardware.bluetooth_le' not in text:
              text = text.replace(root, root + '\n    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />', 1)
          app_manifest.write_text(text)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 1', 'versionCode 24')
          g = g.replace('versionName "1.0"', 'versionName "2.0.4"')
          gradle.write_text(g)
          PY

          chmod +x android/gradlew
          mv /tmp/package.original.json package.json
          mv /tmp/capacitor.config.original.json capacitor.config.json

      - name: Build full-function recovery APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-shell/android
          ./gradlew assembleDebug --stacktrace
          cd ../..
          APK="$(find native-shell/android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk
          "$AAPT" dump badging dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk > /tmp/badging.txt
          "$AAPT" dump permissions dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk > /tmp/permissions.txt
          cat /tmp/badging.txt
          cat /tmp/permissions.txt
          grep -Fq "package: name='com.jarvis.watchbridge.recovery'" /tmp/badging.txt
          for permission in android.permission.RECORD_AUDIO android.permission.BLUETOOTH_SCAN android.permission.BLUETOOTH_CONNECT; do
            grep -Fq "$permission" /tmp/permissions.txt || { echo "Missing required permission: $permission" >&2; exit 1; }
          done
          sha256sum dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk > dist/SHA256SUMS.txt

      - name: Publish recovery release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="watch-bridge-recovery-v2.0.4-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/JARVIS-Watch-Bridge-RECOVERY-v2.0.4.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Watch Bridge Recovery Android v2.0.4" \
            --notes "Recovery build retaining BLE scanning/connection, speech recognition, speech synthesis, local notifications, share, secure storage, and the live JARVIS web/backend. The Android foreground-service plugin is isolated from this build to remove the most likely immediate-launch crash source; it will be restored after launch stability is confirmed."

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Watch-Bridge-RECOVERY-v2.0.4
          path: dist/*
          retention-days: 30
