services:
  - type: web
    name: jarvis-watch-bridge-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VAPI_API_KEY
        sync: false
      - key: JARVIS_SETUP_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
