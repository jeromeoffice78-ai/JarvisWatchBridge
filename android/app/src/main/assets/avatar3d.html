<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}#msg{position:absolute;left:8px;bottom:5px;color:#59c9ff;font:11px sans-serif}</style></head><body><canvas id="c"></canvas><div id="msg">3D LIVE</div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,alpha:true});const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.015,.035,.07,0);const camera=new BABYLON.ArcRotateCamera('cam',Math.PI/2,Math.PI/2.15,6,new BABYLON.Vector3(0,1.05,0),scene);camera.attachControl(canvas,true);camera.lowerRadiusLimit=4.3;camera.upperRadiusLimit=8;new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene).intensity=1.3;const rim=new BABYLON.PointLight('rim',new BABYLON.Vector3(-3,3,-2),scene);rim.diffuse=new BABYLON.Color3(.2,.8,1);rim.intensity=22;let root,jaw,eyeL,eyeR,speaking=false,kind=-1,t=0;const palettes=[['#14202a','#31c9ff'],['#6b3f2d','#111111'],['#5b3528','#24130e'],['#b56d47','#3a2118'],['#d5a37a','#17120f'],['#9a654a','#291710'],['#d8b08c','#55443a']];
function mat(n,c,metal=0){let m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);m.specularPower=metal?128:40;if(metal)m.specularColor=new BABYLON.Color3(.8,.9,1);return m}
function build(k){if(root)root.dispose(false,true);kind=k;root=new BABYLON.TransformNode('person',scene);let p=palettes[k],robot=k===0;let torso=BABYLON.MeshBuilder.CreateBox('torso',{width:2.35,height:2,depth:.8},scene);torso.position.y=.05;torso.parent=root;torso.material=mat('suit',robot?'#111b24':'#101722',robot?1:0);let neck=BABYLON.MeshBuilder.CreateCylinder('neck',{height:.5,diameter:.62},scene);neck.position.y=1.18;neck.parent=root;neck.material=mat('skin',p[0],robot?1:0);let head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:1.45,segments:32},scene);head.scaling=new BABYLON.Vector3(.82,1,.78);head.position.y=1.9;head.parent=root;head.material=mat('face',p[0],robot?1:0);let hair=BABYLON.MeshBuilder.CreateSphere('hair',{diameter:1.5,segments:24,slice:.48},scene);hair.scaling=new BABYLON.Vector3(.84,.72,.8);hair.rotation.x=Math.PI;hair.position.y=2.28;hair.parent=root;hair.material=mat('hair',p[1],robot?1:0);function eye(x){let e=BABYLON.MeshBuilder.CreateSphere('eye',{diameter:.18,segments:16},scene);e.position=new BABYLON.Vector3(x,2.05,-.55);e.scaling.y=.7;e.parent=root;e.material=mat('eye',robot?'#39d7ff':'#f5f5f5',robot?1:0);return e}eyeL=eye(-.27);eyeR=eye(.27);jaw=BABYLON.MeshBuilder.CreateCapsule('jaw',{height:.45,radius:.38},scene);jaw.scaling.x=1.45;jaw.position=new BABYLON.Vector3(0,1.52,-.38);jaw.rotation.x=Math.PI/2;jaw.parent=root;jaw.material=mat('jaw',p[0],robot?1:0);if(robot){for(let x of[-.56,.56]){let line=BABYLON.MeshBuilder.CreateBox('light',{width:.07,height:.75,depth:.05},scene);line.position=new BABYLON.Vector3(x,1.96,-.57);line.rotation.z=x<0?-.3:.3;line.parent=root;let lm=mat('glow','#31c9ff',1);lm.emissiveColor=BABYLON.Color3.FromHexString('#31c9ff');line.material=lm}}root.scaling=new BABYLON.Vector3(1.12,1.12,1.12)}
window.setCharacter=(k,s)=>{speaking=s;if(k!==kind)build(k)};build(0);scene.onBeforeRenderObservable.add(()=>{t+=engine.getDeltaTime()/1000;if(!root)return;root.rotation.y=Math.sin(t*.65)*.08;root.rotation.x=Math.sin(t*.45)*.025;root.position.y=Math.sin(t*1.1)*.025;let open=speaking?(Math.sin(t*15)*.5+.5)*.18:0;jaw.position.y=1.52-open;jaw.scaling.y=1+open*1.8;let blink=Math.pow(Math.max(0,Math.sin(t*1.7)),35);eyeL.scaling.y=eyeR.scaling.y=.7*(1-blink)+.04});engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
</script></body></html>
